<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#3a1c2e">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
  <title>Our space</title>
  <link rel="icon" type="image/svg+xml" href="./heart.svg">
  <link rel="apple-touch-icon" href="./heart.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap&subset=vietnamese">
  <!-- đã đăng nhập trước đó → ẩn form trong lúc kiểm tra phiên, tránh nháy -->
  <script>try { if (localStorage.getItem('space_key')) document.documentElement.classList.add('resume') } catch (e) { }</script>
  <script type="module" src="/src/main.js"></script>
</head>

<body>
  <!-- ============ LOGIN ============ -->
  <section class="gate" id="gate">
    <h1 class="title">Our little space</h1>
    <form class="lock-card enter" id="lock">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <p class="lock-text" id="lock-text">Just for us.<br>Log in to open it.</p>
      <input class="lock-input" id="lock-user" name="username" type="text" placeholder="Account" autocomplete="username"
        autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <input class="lock-input" id="lock-pass" name="password" type="password" placeholder="Password"
        autocomplete="current-password" required>
      <button class="lock-btn" id="lock-btn" type="submit">Unlock</button>
      <p class="lock-error" id="lock-error" role="alert"></p>
    </form>
  </section>

  <!-- ============ APP ============ -->
  <section class="space" id="space" hidden>
    <header class="top">
      <div class="top-main">
        <h1 class="top-title">Our space</h1>
        <p class="presence" id="presence" role="status" aria-live="polite"><span class="dot"></span><span
            id="presence-text">Looking for your other devices…</span></p>
      </div>
      <label class="me">
        <span class="me-label">as</span>
        <input class="me-input" id="me" type="text" maxlength="24" placeholder="Your name" autocomplete="nickname"
          spellcheck="false">
      </label>
      <button class="icon-btn" id="clear-btn" type="button" title="Clear everything on all devices"
        aria-label="Clear everything">🧹</button>
      <button class="icon-btn" id="logout-btn" type="button" title="Log out" aria-label="Log out">⏻</button>
    </header>

    <main class="feed" id="feed" aria-live="polite">
      <div class="empty" id="empty">
        <div class="empty-heart" aria-hidden="true">💌</div>
        <p>Nothing here yet — say something sweet.</p>
        <small>Notes are never stored: they live only while one of your devices has this page open, and appear
          instantly on all the others.</small>
      </div>
      <ol class="notes" id="notes"></ol>
    </main>

    <form class="composer" id="composer">
      <div class="previews" id="previews" hidden></div>
      <div class="compose-row">
        <label class="attach" title="Add photos">
          <input id="file" type="file" accept="image/*" multiple hidden>
          <span aria-hidden="true">📷</span><span class="sr">Add photos</span>
        </label>
        <textarea class="compose-input" id="text" rows="1" maxlength="5000" placeholder="Write a note, paste a link…"
          enterkeyhint="send"></textarea>
        <button class="send-btn" id="send-btn" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.7 1.3 4.6 2.7h1.4c.9-1.4 2.4-2.7 4.6-2.7 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z" />
          </svg>
        </button>
      </div>
      <p class="compose-error" id="compose-error" role="alert"></p>
    </form>
  </section>

  <div class="lightbox" id="lightbox" hidden><img alt=""></div>
</body>

</html>
